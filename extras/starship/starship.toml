# Starship prompt for Dichill — blocky segments in the DrakoVim palette.
# Red:   #D16969 (DrakoVim accent)   Soft red: #E38A8A
# Dark:  #1E1E1E (VS Code editor bg) Block bg: #3A3A3A
# Docs: https://starship.rs/config/

add_newline = true

# Left: path in a red block, then a red $
format = "$directory$character"

# Right: python venv, conda env, git branch + status (one dark block), duration
right_format = "$python$conda$git_branch$git_status$cmd_duration"

[character]
success_symbol = "[\\$](bold fg:#D16969)"
error_symbol = "[\\$](bold fg:#FF5555)"

[directory]
style = "bg:#D16969 fg:#1E1E1E bold"
format = "[ $path ]($style) "
truncation_length = 4
truncate_to_repo = false

[git_branch]
style = "bg:#3A3A3A fg:#E38A8A bold"
format = "[ $symbol$branch]($style)"

[git_status]
style = "bg:#3A3A3A fg:#D7BA7D"
format = "[ $all_status$ahead_behind ]($style) "

[cmd_duration]
min_time = 2000
style = "bg:#D7BA7D fg:#1E1E1E bold"
format = "[ took $duration ]($style)"

[conda]
style = "bg:#2D2D2D fg:#9A9A9A"
format = "[ $symbol$environment ]($style) "
ignore_base = false

# Python virtualenvs (.venv / venv / virtualenv) — only shown when one
# is actually activated, so the prompt stays quiet otherwise.
[python]
style = "bg:#2D2D2D fg:#9A9A9A"
format = "[ \uE73C $virtualenv ]($style) "
detect_extensions = []
detect_files = []
detect_folders = []
